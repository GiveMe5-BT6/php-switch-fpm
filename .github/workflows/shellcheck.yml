name: shellcheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Syntax check
        run: bash -n php-switch.sh && bash -n php-switch.en.sh
      - name: ShellCheck
        run: shellcheck --severity=error php-switch.sh php-switch.en.sh
